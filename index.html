<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fit to Work Karyawan PT. WBS</title>
    <link rel="icon" type="image/png" href="https://res.cloudinary.com/dgjnlxf69/image/upload/v1790130590/Logo_FTW_ul1dz4.png" />
    <link rel="shortcut icon" type="image/png" href="https://res.cloudinary.com/dgjnlxf69/image/upload/v1790130590/Logo_FTW_ul1dz4.png" />
    <link rel="apple-touch-icon" href="https://res.cloudinary.com/dgjnlxf69/image/upload/v1790130590/Logo_FTW_ul1dz4.png" />
    <meta name="theme-color" content="#fafaf9" />
    <meta name="description" content="Aplikasi Fit to Work untuk menilai kesiapan kerja harian karyawan PT. WBS berdasarkan durasi tidur, jam terjaga, dan kondisi kesehatan sebelum memulai shift." />
    <meta property="og:title" content="Fit to Work Karyawan PT. WBS" />
    <meta property="og:description" content="Aplikasi Fit to Work untuk menilai kesiapan kerja harian karyawan PT. WBS berdasarkan durasi tidur, jam terjaga, dan kondisi kesehatan sebelum memulai shift." />
    <meta property="og:image" content="https://res.cloudinary.com/dgjnlxf69/image/upload/v1790130590/Logo_FTW_ul1dz4.png" />
    <meta property="og:image:alt" content="Logo Fit To Work PT. WBS" />
    <link rel="stylesheet" href="./src/index.css" />

    <script>
      window.addEventListener('error', function(event) {
        var root = document.getElementById('root');
        if (root && !root.dataset.rendered) {
          root.innerHTML = '<div class="preloader-container">' +
            '<div class="preloader-card" data-ui>' +
            '<svg aria-hidden="true" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>' +
            '<h2 class="preloader-title">Gagal Memuat Aplikasi</h2>' +
            '<p class="preloader-subtitle">' +
            (event.message || 'Terjadi kendala saat memproses modul aplikasi.') +
            '</p>' +
            '<button type="button" class="reload-btn" onclick="window.location.reload(true)">Muat Ulang Halaman</button>' +
            '</div></div>';
        }
      });
    </script>
  </head>
  <body>
    <div id="root">
      <div class="preloader-container">
        <div class="preloader-card" data-ui>
          <img
            src="https://res.cloudinary.com/dgjnlxf69/image/upload/v1790130590/Logo_FTW_ul1dz4.png"
            alt="Logo FTW PT. WBS"
            class="preloader-logo"
            fetchpriority="high"
            onerror="this.hidden=true"
          />
          <div>
            <h1 class="preloader-title">Fit to Work PT. WBS</h1>
            <p class="preloader-subtitle">Memuat sistem asesmen kesiapan kerja…</p>
          </div>
          <div class="preloader-spinner" data-ui aria-hidden="true"></div>
          <div id="delayed-reload" class="preloader-delayed">
            <p class="preloader-note">Membutuhkan waktu lebih lama dari biasanya?</p>
            <button type="button" class="reload-btn" onclick="window.location.reload(true)">Muat Ulang Halaman</button>
          </div>
        </div>
      </div>
      <script>
        setTimeout(function() {
          var delayed = document.getElementById('delayed-reload');
          if (delayed) delayed.style.display = 'block';
        }, 3500);
      </script>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
